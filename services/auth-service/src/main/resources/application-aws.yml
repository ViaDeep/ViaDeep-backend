# Configuración obligatoria para ECS/Fargate.
spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=auth&sslmode=verify-full&sslrootcert=${DB_SSL_ROOT_CERT}"
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

viadeep:
  jwt:
    issuer: ${VIADEEP_JWT_ISSUER}
    ttl: ${VIADEEP_JWT_TTL}
    key-id: ${VIADEEP_JWT_KEY_ID}
    private-key: ${VIADEEP_JWT_PRIVATE_KEY}
  operators:
    allowed-email-domains: ${OPERATOR_EMAIL_DOMAINS}
  mail:
    from: ${MAIL_FROM}