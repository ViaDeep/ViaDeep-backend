server:
  port: ${PORT:8082}

spring:
  application:
    name: incident-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:viadeep}?currentSchema=incidents,public
    username: ${DB_USER:incidents_svc}
    password: ${DB_PASSWORD:incidents_svc}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: incidents
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/auth/.well-known/jwks.json}
  flyway:
    schemas: incidents
    default-schema: incidents

viadeep:
  incidents:
    # Radio (en metros) para buscar posibles duplicados abiertos del mismo tipo.
    duplicate-radius-meters: ${INCIDENT_DUPLICATE_RADIUS_METERS:30}
  evidence-service:
    base-url: ${EVIDENCE_SERVICE_URL:http://localhost:8083}
    timeout: ${EVIDENCE_SERVICE_TIMEOUT:3s}
  notification-service:
    # Avisos asíncronos (ADR-013): si el servicio no responde, se reintenta y luego se registra en los logs.
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
    timeout: ${NOTIFICATION_SERVICE_TIMEOUT:2s}
    internal-token: ${NOTIFICATIONS_INTERNAL_TOKEN:viadeep-dev-internal-token}
    max-attempts: ${NOTIFICATION_SERVICE_MAX_ATTEMPTS:3}
    retry-wait: ${NOTIFICATION_SERVICE_RETRY_WAIT:500ms}
    open-circuit-wait: ${NOTIFICATION_SERVICE_OPEN_CIRCUIT_WAIT:30s}
  geocoding:
    # Distrito automático a partir del GPS con Nominatim (OpenStreetMap). Si falla, el reporte se registra sin distrito.
    enabled: ${GEOCODING_ENABLED:true}
    base-url: ${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
    user-agent: ${GEOCODING_USER_AGENT:ViaDeep/0.1 (tesis UPC; reportes viales Lima)}
    timeout: ${GEOCODING_TIMEOUT:2s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
