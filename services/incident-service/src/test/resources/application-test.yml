# Las pruebas usan el PostgreSQL + PostGIS del docker-compose (o el servicio del CI),
# en un esquema propio que se limpia al iniciar.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:viadeep}?currentSchema=incidents_test,public
    username: ${DB_TEST_USER:viadeep}
    password: ${DB_TEST_PASSWORD:viadeep}
  jpa:
    properties:
      hibernate:
        default_schema: incidents_test
  flyway:
    schemas: incidents_test
    default-schema: incidents_test
    clean-disabled: false
