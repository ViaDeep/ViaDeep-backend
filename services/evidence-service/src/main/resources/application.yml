server:
  port: ${PORT:8083}

spring:
  application:
    name: evidence-service
  servlet:
    multipart:
      # ADR-005: máximo 5 MB decimales por fotografía; el multipart total conserva 6 MiB.
      max-file-size: 5000000B
      max-request-size: 6291456B
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:viadeep}?currentSchema=evidences
    username: ${DB_USER:evidences_svc}
    password: ${DB_PASSWORD:evidences_svc}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: evidences
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${VIADEEP_JWT_ISSUER:viadeep-auth}
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/auth/.well-known/jwks.json}
  flyway:
    schemas: evidences
    default-schema: evidences

viadeep:
  evidence:
    # Segunda barrera en el dominio, con el mismo límite decimal que el parser multipart.
    max-size-bytes: 5000000
    url-ttl: ${EVIDENCE_URL_TTL:10m}
  s3:
    bucket: ${S3_BUCKET:viadeep-evidences}
    region: ${AWS_REGION:us-east-1}
    # Solo en local (emulador S3 del docker-compose). En AWS se deja vacío y se usan las credenciales del rol de la tarea ECS.
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    # Dirección con la que el navegador y el celular descargan las fotos, si es distinta de la que usa el servicio
    # (en el servidor: el servicio entra por la red interna de Docker y las fotos salen por https).
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:viadeep}
    secret-key: ${S3_SECRET_KEY:viadeep-dev-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info
