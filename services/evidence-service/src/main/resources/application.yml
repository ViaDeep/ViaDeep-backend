server:
  port: ${PORT:8083}

spring:
  application:
    name: evidence-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:viadeep}?currentSchema=evidences
    username: ${DB_USER:evidences_svc}
    password: ${DB_PASSWORD:evidences_svc}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: evidences
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/auth/.well-known/jwks.json}
  flyway:
    schemas: evidences
    default-schema: evidences

viadeep:
  evidence:
    max-size-bytes: ${EVIDENCE_MAX_SIZE_BYTES:10485760}
    url-ttl: ${EVIDENCE_URL_TTL:10m}
  s3:
    bucket: ${S3_BUCKET:viadeep-evidences}
    region: ${AWS_REGION:us-east-1}
    # Solo en local (emulador S3 del docker-compose). En AWS se deja vacío y se usan las credenciales del rol de la tarea ECS.
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:viadeep}
    secret-key: ${S3_SECRET_KEY:viadeep-dev-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info
