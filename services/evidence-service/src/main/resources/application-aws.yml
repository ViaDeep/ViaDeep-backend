# Configuración obligatoria para ECS/Fargate. En AWS no se configura un endpoint
# alternativo ni credenciales estáticas: el SDK obtiene credenciales del Task IAM Role.
spring:
  servlet:
    multipart:
      # Valores explícitos en AWS para mantener la solicitud por debajo del límite de 10 MB de API Gateway.
      max-file-size: 5000000B
      max-request-size: 6291456B
  datasource:
    url: "jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=evidences&sslmode=verify-full&sslrootcert=${DB_SSL_ROOT_CERT}"
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${VIADEEP_JWT_ISSUER}
          jwk-set-uri: ${AUTH_JWKS_URI}

viadeep:
  evidence:
    max-size-bytes: 5000000
  s3:
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION}
    endpoint: ""
    public-endpoint: ""
    access-key: ""
    secret-key: ""
