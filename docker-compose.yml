# Entorno local: PostgreSQL + PostGIS con un esquema por microservicio,
# y un emulador local de Amazon S3 para las fotografías.
# Uso: docker compose up -d
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: viadeep-db
    environment:
      POSTGRES_DB: viadeep
      POSTGRES_USER: viadeep
      POSTGRES_PASSWORD: viadeep
    ports:
      - "5432:5432"
    volumes:
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
      - viadeep-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viadeep -d viadeep"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Emulador local de Amazon S3 (moto). Guarda las fotos en memoria: se pierden al reiniciar el contenedor.
  # El servicio de evidencias crea el bucket al arrancar si no existe.
  storage:
    image: motoserver/moto:5.1.0
    container_name: viadeep-storage
    ports:
      - "9000:5000"

volumes:
  viadeep-db-data:
